server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080,http://localhost:8088}"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**
        - id: document-service
          uri: ${DOCUMENT_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/documents/**
        - id: embedding-service
          uri: ${EMBEDDING_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/embeddings/**
        - id: search-service
          uri: ${SEARCH_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/search/**
        - id: chat-service
          uri: ${CHAT_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/v1/chat/**
        # Proxied OpenAPI specs for aggregated Swagger UI
        - id: auth-docs
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/docs/auth/**
          filters:
            - RewritePath=/docs/auth/(?<segment>.*), /$\{segment}
        - id: document-docs
          uri: ${DOCUMENT_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/docs/documents/**
          filters:
            - RewritePath=/docs/documents/(?<segment>.*), /$\{segment}
        - id: embedding-docs
          uri: ${EMBEDDING_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/docs/embeddings/**
          filters:
            - RewritePath=/docs/embeddings/(?<segment>.*), /$\{segment}
        - id: search-docs
          uri: ${SEARCH_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/docs/search/**
          filters:
            - RewritePath=/docs/search/(?<segment>.*), /$\{segment}
        - id: chat-docs
          uri: ${CHAT_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/docs/chat/**
          filters:
            - RewritePath=/docs/chat/(?<segment>.*), /$\{segment}

jwt:
  secret: ${JWT_SECRET:q8tcHiRtlAmIew4sB5s0HSBrdP68FF9hGhuFA38RWII=}
  enabled: ${GATEWAY_JWT_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [%X{correlationId}] %logger{36} - %msg%n"
  level:
    root: INFO
    com.bharat: INFO

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: Auth Service
        url: /docs/auth/v3/api-docs
      - name: Document Service
        url: /docs/documents/v3/api-docs
      - name: Embedding Service
        url: /docs/embeddings/v3/api-docs
      - name: Search Service
        url: /docs/search/v3/api-docs
      - name: Chat Service
        url: /docs/chat/v3/api-docs
    urls-primary-name: Auth Service
