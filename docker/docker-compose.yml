services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build:
      context: ..
      dockerfile: docker/auth-service/Dockerfile
    container_name: rag-auth-service
    environment:
      SERVER_PORT: 8081
      DB_URL: jdbc:postgresql://postgres:5432/auth_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: q8tcHiRtlAmIew4sB5s0HSBrdP68FF9hGhuFA38RWII=
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:8080
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  document-service:
    build:
      context: ..
      dockerfile: docker/document-service/Dockerfile
    container_name: rag-document-service
    environment:
      SERVER_PORT: 8082
      DB_URL: jdbc:postgresql://postgres:5432/document_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      EMBEDDING_SERVICE_URL: http://embedding-service:8083
      SEARCH_SERVICE_URL: http://search-service:8084
      DOCUMENT_STORAGE_PATH: /app/data/documents
    volumes:
      - document_data:/app/data/documents
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      embedding-service:
        condition: service_started
      search-service:
        condition: service_started

  embedding-service:
    build:
      context: ..
      dockerfile: docker/embedding-service/Dockerfile
    container_name: rag-embedding-service
    environment:
      SERVER_PORT: 8083
      EMBEDDING_PROVIDER: stub
      EMBEDDING_DIMENSIONS: 384
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8083:8083"

  search-service:
    build:
      context: ..
      dockerfile: docker/search-service/Dockerfile
    container_name: rag-search-service
    environment:
      SERVER_PORT: 8084
      DB_URL: jdbc:postgresql://postgres:5432/search_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy

  chat-service:
    build:
      context: ..
      dockerfile: docker/chat-service/Dockerfile
    container_name: rag-chat-service
    environment:
      SERVER_PORT: 8085
      DB_URL: jdbc:postgresql://postgres:5432/chat_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SEARCH_SERVICE_URL: http://search-service:8084
      EMBEDDING_SERVICE_URL: http://embedding-service:8083
      LLM_PROVIDER: stub
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
      search-service:
        condition: service_started
      embedding-service:
        condition: service_started

  api-gateway:
    build:
      context: ..
      dockerfile: docker/api-gateway/Dockerfile
    container_name: rag-api-gateway
    environment:
      SERVER_PORT: 8080
      AUTH_SERVICE_URL: http://auth-service:8081
      DOCUMENT_SERVICE_URL: http://document-service:8082
      EMBEDDING_SERVICE_URL: http://embedding-service:8083
      SEARCH_SERVICE_URL: http://search-service:8084
      CHAT_SERVICE_URL: http://chat-service:8085
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      JWT_SECRET: q8tcHiRtlAmIew4sB5s0HSBrdP68FF9hGhuFA38RWII=
      GATEWAY_JWT_ENABLED: "true"
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - document-service
      - embedding-service
      - search-service
      - chat-service

volumes:
  postgres_data:
  document_data:
