# Use local Postgres on the Mac host (no Docker bind on :5432).
#
# Setup DBs once:
#   psql -U postgres -d postgres -f docker/postgres/local-init.sql
#
# Start:
#   export DB_USERNAME=postgres DB_PASSWORD=postgres
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.local-db.yml up --build

services:
  # Replace real Postgres container with a no-port stub so depends_on still resolves,
  # while app services connect to host Postgres via host.docker.internal.
  postgres:
    image: busybox:1.36
    container_name: rag-postgres-stub
    command: ["sh", "-c", "echo 'Using host Postgres via host.docker.internal'; while true; do sleep 3600; done"]
    ports: []
    volumes: []
    environment: {}
    healthcheck:
      test: ["CMD", "true"]
      interval: 2s
      timeout: 2s
      retries: 3
      start_period: 1s

  auth-service:
    environment:
      DB_URL: jdbc:postgresql://host.docker.internal:5432/auth_db
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  document-service:
    environment:
      DB_URL: jdbc:postgresql://host.docker.internal:5432/document_db
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  search-service:
    environment:
      DB_URL: jdbc:postgresql://host.docker.internal:5432/search_db
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      SEARCH_PGVECTOR_ENABLED: ${SEARCH_PGVECTOR_ENABLED:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  chat-service:
    environment:
      DB_URL: jdbc:postgresql://host.docker.internal:5432/chat_db
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
    extra_hosts:
      - "host.docker.internal:host-gateway"
