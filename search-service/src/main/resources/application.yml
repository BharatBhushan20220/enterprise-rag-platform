server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: search-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/search_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

search:
  pgvector-enabled: ${SEARCH_PGVECTOR_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
