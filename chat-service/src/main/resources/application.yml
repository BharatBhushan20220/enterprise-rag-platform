server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: chat-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/chat_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

rag:
  search-service-url: ${SEARCH_SERVICE_URL:http://localhost:8084}
  embedding-service-url: ${EMBEDDING_SERVICE_URL:http://localhost:8083}
  embedding-model: ${EMBEDDING_MODEL:text-embedding-3-small}

llm:
  provider: ${LLM_PROVIDER:stub}
  model: ${LLM_MODEL:gpt-4o-mini}

openai:
  api-key: ${OPENAI_API_KEY:}
  base-url: ${OPENAI_BASE_URL:https://api.openai.com}

management:
  endpoints:
    web:
      exposure:
        include: health,info
