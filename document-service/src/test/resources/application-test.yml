spring:
  datasource:
    url: jdbc:h2:mem:document_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false

document:
  storage-path: ${java.io.tmpdir}/rag-docs-test
  chunk-size: 50
  chunk-overlap: 10

rag:
  embedding-service-url: http://localhost:8083
  search-service-url: http://localhost:8084
  embedding-model: stub
