server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: document-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/document_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

document:
  storage-path: ${DOCUMENT_STORAGE_PATH:./data/documents}
  chunk-size: ${DOCUMENT_CHUNK_SIZE:800}
  chunk-overlap: ${DOCUMENT_CHUNK_OVERLAP:120}

rag:
  embedding-service-url: ${EMBEDDING_SERVICE_URL:http://localhost:8083}
  search-service-url: ${SEARCH_SERVICE_URL:http://localhost:8084}
  embedding-model: ${EMBEDDING_MODEL:text-embedding-3-small}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [%X{correlationId}] %logger{36} - %msg%n"
  level:
    root: INFO
    com.bharat: INFO

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
