server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: auth-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/auth_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.hibernate.SQL: ${HIBERNATE_SQL_LOG:WARN}

jwt:
  secret: ${JWT_SECRET:q8tcHiRtlAmIew4sB5s0HSBrdP68FF9hGhuFA38RWII=}
  expiration: ${JWT_EXPIRATION:86400000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080,http://localhost:8088}

redis:
  enabled: ${REDIS_ENABLED:false}

mail:
  provider: ${MAIL_PROVIDER:logging}

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}

auth:
  require-email-verification: ${AUTH_REQUIRE_EMAIL_VERIFICATION:false}
  verification-token-ttl-hours: 24
  reset-token-ttl-hours: 2
  bootstrap-admin:
    enabled: ${AUTH_BOOTSTRAP_ADMIN_ENABLED:true}
    email: ${AUTH_BOOTSTRAP_ADMIN_EMAIL:admin@example.com}
    password: ${AUTH_BOOTSTRAP_ADMIN_PASSWORD:Admin@12345}
    first-name: Platform
    last-name: Admin
